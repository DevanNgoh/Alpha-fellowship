<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alpha Youth Minister's Cohort Cameroon Attendance</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>

<div id="confetti-container"></div>

<div class="background"></div>

<div class="card">

    <div class="logo">

        ✝

    </div>

    <h1>Alpha Youth Minister's Cohort Cameroon</h1>

    <h2>Attendance Check-In</h2>

    <p id="greeting"></p>

    <form id="attendanceForm">

        <div class="input-group">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

        </div>

        <div class="input-group">

            <label>Church</label>

            <input
                type="text"
                id="church"
                placeholder="Church name">

        </div>

        <!-- RE-ADDED COUNTRY INPUT BLOCK -->
        <div class="input-group">

            <label>Country</label>

            <input
                type="text"
                id="country"
                placeholder="Enter country">

        </div>

        <button id="submitBtn">

            Record Attendance

        </button>

    </form>

    <p id="message"></p>

    <a href="index.html" class="back">← Back to Home</a>

    <footer>

        "How good and pleasant it is when God's people live together in unity."

        <br>

        Psalm 133:1

    </footer>

</div>

<script src="js/theme.js"></script>
<script src="js/script.js"></script>

</body>

</html>
